# Render Blueprint: one free web service that runs the game server and serves the app.
# Matches are saved in Postgres (DATABASE_URL), since the free plan's disk is wiped on restart.
services:
  - type: web
    name: penta
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
